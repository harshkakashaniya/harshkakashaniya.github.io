<svg xmlns="http://www.w3.org/2000/svg" width="220" height="140" viewBox="0 0 220 140">
  <!-- Background -->
  <rect width="220" height="140" fill="#0d1117"/>

  <!-- Board background -->
  <rect x="10" y="15" width="145" height="115" rx="10" fill="#1a3a8f"/>

  <!-- Grid cells (5 cols x 4 rows for thumb) -->
  <!-- Row 1 -->
  <circle cx="37" cy="38" r="13" fill="#070e1a"/>
  <circle cx="66" cy="38" r="13" fill="#070e1a"/>
  <circle cx="95" cy="38" r="13" fill="#070e1a"/>
  <circle cx="124" cy="38" r="13" fill="#070e1a"/>

  <!-- Row 2 -->
  <circle cx="37" cy="67" r="13" fill="#070e1a"/>
  <circle cx="66" cy="67" r="13" fill="#e74c3c"/>
  <circle cx="95" cy="67" r="13" fill="#f1c40f"/>
  <circle cx="124" cy="67" r="13" fill="#070e1a"/>

  <!-- Row 3 -->
  <circle cx="37" cy="96" r="13" fill="#f1c40f"/>
  <circle cx="66" cy="96" r="13" fill="#e74c3c"/>
  <circle cx="95" cy="96" r="13" fill="#e74c3c"/>
  <circle cx="124" cy="96" r="13" fill="#f1c40f"/>

  <!-- Row 4 -->
  <circle cx="37" cy="125" r="13" fill="#f1c40f"/>
  <circle cx="66" cy="125" r="13" fill="#e74c3c"/>
  <circle cx="95" cy="125" r="13" fill="#f1c40f"/>
  <circle cx="124" cy="125" r="13" fill="#e74c3c"/>

  <!-- Winning highlight diagonal -->
  <circle cx="66" cy="67" r="13" fill="#e74c3c" opacity="0.0"/>
  <circle cx="66" cy="96" r="13" fill="#e74c3c" stroke="#fff" stroke-width="2.5" opacity="0.9"/>
  <circle cx="95" cy="96" r="13" fill="#e74c3c" stroke="#fff" stroke-width="2.5" opacity="0.9"/>
  <circle cx="66" cy="67" r="13" fill="#e74c3c" stroke="#fff" stroke-width="2.5" opacity="0.9"/>

  <!-- Side panel -->
  <rect x="163" y="15" width="47" height="115" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- Red disc -->
  <circle cx="186" cy="42" r="14" fill="#e74c3c"/>
  <circle cx="182" cy="38" r="4" fill="rgba(255,255,255,0.2)"/>
  <text x="186" cy="42" text-anchor="middle" font-size="9" fill="white" font-weight="bold" y="46">P1</text>

  <!-- Yellow disc -->
  <circle cx="186" cy="80" r="14" fill="#f1c40f"/>
  <circle cx="182" cy="76" r="4" fill="rgba(255,255,255,0.25)"/>
  <text x="186" text-anchor="middle" font-size="9" fill="#333" font-weight="bold" y="84">P2</text>

  <text x="186" text-anchor="middle" font-size="9" fill="#8b949e" y="115">🏆</text>
</svg>
