<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 140">
  <defs>
    <radialGradient id="bj-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c2244"/>
      <stop offset="100%" stop-color="#080b14"/>
    </radialGradient>
    <radialGradient id="bj-felt" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a5433"/>
      <stop offset="100%" stop-color="#0a2818"/>
    </radialGradient>
    <filter id="bj-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.65"/>
    </filter>
    <filter id="bj-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="220" height="140" fill="url(#bj-bg)"/>

  <!-- Felt oval -->
  <ellipse cx="110" cy="70" rx="96" ry="54" fill="url(#bj-felt)" opacity="0.55"/>
  <ellipse cx="110" cy="70" rx="96" ry="54" fill="none" stroke="#2e7a4a" stroke-width="1.5" opacity="0.35"/>

  <!-- Subtle gold arc at top -->
  <path d="M 18 70 A 93 52 0 0 1 202 70" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.18"/>

  <!-- Card back (leftmost, most rotated) -->
  <g transform="rotate(-18 72 72)">
    <rect x="44" y="28" width="56" height="78" rx="6" fill="#1e2e96" stroke="#c9a227" stroke-width="1.2" filter="url(#bj-shadow)"/>
    <rect x="49" y="33" width="46" height="68" rx="4" fill="none" stroke="#c9a227" stroke-width="0.7" opacity="0.45"/>
    <!-- Subtle diamond pattern on back -->
    <path d="M 72 40 L 84 55 L 72 70 L 60 55 Z" fill="none" stroke="#c9a227" stroke-width="0.8" opacity="0.3"/>
    <path d="M 72 60 L 84 75 L 72 90 L 60 75 Z" fill="none" stroke="#c9a227" stroke-width="0.8" opacity="0.3"/>
  </g>

  <!-- King of Hearts card -->
  <g transform="rotate(-7 100 70)">
    <rect x="68" y="20" width="56" height="78" rx="6" fill="#fdfaf5" stroke="#ddd" stroke-width="0.8" filter="url(#bj-shadow)"/>
    <!-- Corner marks -->
    <text x="74" y="36" font-size="9" font-weight="bold" fill="#b22222" font-family="Georgia,serif">K</text>
    <text x="75" y="46" font-size="9" fill="#b22222" font-family="Georgia,serif">♥</text>
    <text x="118" y="90" font-size="9" font-weight="bold" fill="#b22222" font-family="Georgia,serif" transform="rotate(180 118 88)">K</text>
    <text x="118" y="82" font-size="9" fill="#b22222" font-family="Georgia,serif" transform="rotate(180 118 80)">♥</text>
    <!-- Center heart -->
    <text x="96" y="67" text-anchor="middle" font-size="24" fill="#b22222" font-family="Georgia,serif" opacity="0.85">♥</text>
  </g>

  <!-- Ace of Spades (front hero card) -->
  <g transform="rotate(9 138 68)">
    <rect x="108" y="15" width="60" height="82" rx="6" fill="#fdfaf5" stroke="#ddd" stroke-width="0.8" filter="url(#bj-shadow)"/>
    <!-- Gold inner accent border -->
    <rect x="112" y="19" width="52" height="74" rx="4" fill="none" stroke="#d4af37" stroke-width="0.9" opacity="0.55"/>
    <!-- Corner marks -->
    <text x="115" y="32" font-size="9" font-weight="bold" fill="#0d0d1a" font-family="Georgia,serif">A</text>
    <text x="116" y="42" font-size="9" fill="#0d0d1a" font-family="Georgia,serif">♠</text>
    <text x="162" y="90" font-size="9" font-weight="bold" fill="#0d0d1a" font-family="Georgia,serif" transform="rotate(180 162 88)">A</text>
    <text x="162" y="82" font-size="9" fill="#0d0d1a" font-family="Georgia,serif" transform="rotate(180 162 80)">♠</text>
    <!-- Large center spade -->
    <text x="138" y="66" text-anchor="middle" font-size="30" fill="#0d0d1a" font-family="Georgia,serif" opacity="0.9">♠</text>
  </g>

  <!-- Gold "· 21 ·" label -->
  <text x="110" y="131" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#d4af37"
        font-family="Georgia,serif" filter="url(#bj-glow)" letter-spacing="5" opacity="0.9">· 21 ·</text>
</svg>
