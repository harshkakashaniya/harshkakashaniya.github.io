<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071a07"/>
      <stop offset="100%" stop-color="#001428"/>
    </linearGradient>
    <radialGradient id="apple-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1744" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff1744" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="golden-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="180" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#0a2a0a" stroke-width="0.5" opacity="0.7">
    <line x1="20" y1="0" x2="20" y2="180"/><line x1="40" y1="0" x2="40" y2="180"/>
    <line x1="60" y1="0" x2="60" y2="180"/><line x1="80" y1="0" x2="80" y2="180"/>
    <line x1="100" y1="0" x2="100" y2="180"/><line x1="120" y1="0" x2="120" y2="180"/>
    <line x1="140" y1="0" x2="140" y2="180"/><line x1="160" y1="0" x2="160" y2="180"/>
    <line x1="180" y1="0" x2="180" y2="180"/><line x1="200" y1="0" x2="200" y2="180"/>
    <line x1="220" y1="0" x2="220" y2="180"/><line x1="240" y1="0" x2="240" y2="180"/>
    <line x1="260" y1="0" x2="260" y2="180"/><line x1="280" y1="0" x2="280" y2="180"/>
    <line x1="0" y1="20" x2="300" y2="20"/><line x1="0" y1="40" x2="300" y2="40"/>
    <line x1="0" y1="60" x2="300" y2="60"/><line x1="0" y1="80" x2="300" y2="80"/>
    <line x1="0" y1="100" x2="300" y2="100"/><line x1="0" y1="120" x2="300" y2="120"/>
    <line x1="0" y1="140" x2="300" y2="140"/><line x1="0" y1="160" x2="300" y2="160"/>
  </g>

  <!-- Obstacle blocks (level theme hints) -->
  <rect x="21" y="21" width="18" height="18" rx="2" fill="#5d4037" opacity="0.7"/>
  <rect x="261" y="21" width="18" height="18" rx="2" fill="#5d4037" opacity="0.7"/>
  <rect x="21" y="141" width="18" height="18" rx="2" fill="#5d4037" opacity="0.7"/>
  <rect x="261" y="141" width="18" height="18" rx="2" fill="#5d4037" opacity="0.7"/>

  <!-- Snake body segments (S-curve shape) -->
  <rect x="82" y="62" width="16" height="16" rx="4" fill="#00c853"/>
  <rect x="102" y="62" width="16" height="16" rx="4" fill="#00c853"/>
  <rect x="122" y="62" width="16" height="16" rx="4" fill="#00c853"/>
  <rect x="142" y="62" width="16" height="16" rx="4" fill="#00c853"/>
  <rect x="162" y="62" width="16" height="16" rx="4" fill="#00c853"/>
  <rect x="162" y="82" width="16" height="16" rx="4" fill="#00c853"/>
  <rect x="162" y="102" width="16" height="16" rx="4" fill="#00c853"/>
  <rect x="142" y="102" width="16" height="16" rx="4" fill="#00c853"/>
  <rect x="122" y="102" width="16" height="16" rx="4" fill="#00c853"/>
  <rect x="122" y="122" width="16" height="16" rx="4" fill="#00c853"/>

  <!-- Snake head (facing right) -->
  <rect x="62" y="62" width="18" height="18" rx="5" fill="#69f0ae" filter="url(#glow)"/>
  <!-- Eyes -->
  <circle cx="74" cy="67" r="2.5" fill="#003d1e"/>
  <circle cx="74" cy="75" r="2.5" fill="#003d1e"/>
  <circle cx="73.2" cy="66.2" r="1" fill="rgba(255,255,255,0.8)"/>
  <circle cx="73.2" cy="74.2" r="1" fill="rgba(255,255,255,0.8)"/>

  <!-- Apple glow -->
  <circle cx="122" cy="42" r="18" fill="url(#apple-glow)"/>
  <!-- Apple -->
  <circle cx="122" cy="42" r="9" fill="#ff1744"/>
  <circle cx="119.3" cy="39.3" r="2.5" fill="rgba(255,255,255,0.4)"/>
  <!-- Stem -->
  <line x1="122" y1="33" x2="124" y2="26" stroke="#2e7d32" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Golden apple glow -->
  <circle cx="220" cy="100" r="18" fill="url(#golden-glow)"/>
  <!-- Golden apple -->
  <circle cx="220" cy="100" r="9" fill="#ffd700"/>
  <circle cx="217" cy="97" r="2.5" fill="rgba(255,255,255,0.55)"/>
  <line x1="220" y1="91" x2="222" y2="84" stroke="#9a6700" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Orbiting dots -->
  <circle cx="230" cy="94" r="2" fill="#ff8f00"/>
  <circle cx="214" cy="110" r="2" fill="#ff8f00"/>

  <!-- Title text -->
  <text x="150" y="172" font-family="'Segoe UI',Arial,sans-serif" font-size="12"
        font-weight="700" fill="#c9a84c" text-anchor="middle" letter-spacing="3">
    10 WORLDS
  </text>
</svg>
