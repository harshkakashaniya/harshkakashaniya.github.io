<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180">
  <defs>
    <radialGradient id="sc-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1c2244"/>
      <stop offset="100%" stop-color="#07070f"/>
    </radialGradient>
    <filter id="sc-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="300" height="180" fill="url(#sc-bg)"/>

  <!-- Faint checkerboard patch behind the pieces -->
  <g opacity="0.16">
    <rect x="60" y="30" width="180" height="120" fill="none" stroke="#d4af37" stroke-width="1"/>
    <rect x="60" y="30" width="30" height="30" fill="#d4af37"/>
    <rect x="120" y="30" width="30" height="30" fill="#d4af37"/>
    <rect x="180" y="30" width="30" height="30" fill="#d4af37"/>
    <rect x="90" y="60" width="30" height="30" fill="#d4af37"/>
    <rect x="150" y="60" width="30" height="30" fill="#d4af37"/>
    <rect x="210" y="60" width="30" height="30" fill="#d4af37"/>
    <rect x="60" y="90" width="30" height="30" fill="#d4af37"/>
    <rect x="120" y="90" width="30" height="30" fill="#d4af37"/>
    <rect x="180" y="90" width="30" height="30" fill="#d4af37"/>
    <rect x="90" y="120" width="30" height="30" fill="#d4af37"/>
    <rect x="150" y="120" width="30" height="30" fill="#d4af37"/>
    <rect x="210" y="120" width="30" height="30" fill="#d4af37"/>
  </g>

  <!-- Small scattered pieces to suggest "scrambled" -->
  <g fill="#8a93b8" opacity="0.5">
    <g transform="translate(18 118) scale(0.22) rotate(-18 50 50)">
      <circle cx="50" cy="30" r="11"/><path d="M 41 41 L 59 41 L 67 79 L 33 79 Z"/>
      <rect x="33" y="79" width="34" height="9"/><rect x="25" y="88" width="50" height="10" rx="3"/>
    </g>
    <g transform="translate(258 40) scale(0.2) rotate(22 50 50)">
      <circle cx="50" cy="30" r="11"/><path d="M 41 41 L 59 41 L 67 79 L 33 79 Z"/>
      <rect x="33" y="79" width="34" height="9"/><rect x="25" y="88" width="50" height="10" rx="3"/>
    </g>
    <g transform="translate(250 145) scale(0.18) rotate(-30 50 50)">
      <circle cx="50" cy="30" r="11"/><path d="M 41 41 L 59 41 L 67 79 L 33 79 Z"/>
      <rect x="33" y="79" width="34" height="9"/><rect x="25" y="88" width="50" height="10" rx="3"/>
    </g>
  </g>

  <!-- Hero pieces: King (white) and Knight (black) from the game's own piece set -->
  <g transform="translate(38 22) scale(1.02)" filter="url(#sc-glow)">
    <g fill="#f5f5f2" stroke="#0d0d1a" stroke-width="3" stroke-linejoin="round">
      <rect x="47" y="7" width="6" height="15"/>
      <rect x="41" y="12" width="18" height="6"/>
      <path d="M 33 40 C 33 28 40 24 50 24 C 60 24 67 28 67 40 Z"/>
      <path d="M 33 40 L 67 40 L 67 79 L 33 79 Z"/>
      <rect x="33" y="79" width="34" height="9"/>
      <rect x="25" y="88" width="50" height="10" rx="3"/>
    </g>
  </g>

  <g transform="translate(158 34) scale(0.88) rotate(6 50 50)" filter="url(#sc-glow)">
    <g fill="#0d0d1a" stroke="#d4af37" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 40 79 L 40 52 L 62 52 L 62 79 Z"/>
      <path d="M 62 52 C 65 35 58 20 46 18 L 20 28 L 12 34 L 19 38 L 15 43 C 22 48 30 50 40 52 Z"/>
      <polygon points="45,18 53,7 56,20"/>
      <rect x="33" y="79" width="34" height="9"/>
      <rect x="25" y="88" width="50" height="10" rx="3"/>
    </g>
  </g>

  <!-- Title -->
  <text x="150" y="171" font-family="'Segoe UI',Arial,sans-serif" font-size="15"
        font-weight="700" fill="#d4af37" text-anchor="middle" letter-spacing="2.5">
    SCRAMBLED CHESS
  </text>
</svg>
