---
layout: default
title: Games
---

<style>
  .games-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 30px;
    padding: 20px 0;
  }
  .game-card {
    display: inline-block;
    width: 220px;
    background: #1a1a2e;
    border: 2px solid #d4af37;
    border-radius: 12px;
    overflow: hidden;
    text-align: center;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
    cursor: pointer;
    position: relative;
    z-index: 10;
  }
  .game-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 8px 24px rgba(212,175,55,0.4);
  }
  .game-card img {
    width: 100%;
    height: 140px;
    object-fit: cover;
  }
  .game-card-label {
    padding: 10px 12px 12px;
    font-size: 18px;
    font-weight: bold;
    color: #d4af37;
    background: #0f0f1a;
  }
  .game-sessions {
    font-size: 11px;
    font-weight: 600;
    color: rgba(212,175,55,0.6);
    margin-top: 5px;
    letter-spacing: 0.05em;
    min-height: 16px;
  }
  .game-sessions .sess-num {
    color: #d4af37;
    font-size: 13px;
  }
</style>

<section class="row-fluid">
<div class="Left-project">
<div class="container-fluid">
  <div class="row-fluid">
    <div class="span12">
      <h1><font color="white">Games</font></h1>
      <p><font color="white">Click on a game to play!</font></p>
      <div class="games-grid">
        <a href="{{ site.baseurl }}/Games/blackjack.html" class="game-card">
          <img src="{{ site.baseurl }}/Games/screenshot-1774116932992.jpg" alt="Blackjack" />
          <div class="game-card-label">&#9824; Blackjack
            <div class="game-sessions">👥 <span class="sess-num" data-game="blackjack">--</span> sessions</div>
          </div>
        </a>
        <a href="{{ site.baseurl }}/Games/snakeladder.html" class="game-card">
          <img src="{{ site.baseurl }}/Games/snakeladder-thumb.svg" alt="Snake & Ladder" />
          <div class="game-card-label">🐍 Advance Snake and Ladder
            <div class="game-sessions">👥 <span class="sess-num" data-game="snakeladder">--</span> sessions</div>
          </div>
        </a>
        <a href="{{ site.baseurl }}/Games/4inarow.html" class="game-card">
          <img src="{{ site.baseurl }}/Games/4inarow-thumb.svg" alt="4 in a Row" />
          <div class="game-card-label">🔴 4 in a Row
            <div class="game-sessions">👥 <span class="sess-num" data-game="4inarow">--</span> sessions</div>
          </div>
        </a>
      </div>
    </div>
  </div>
</div>
</div>
</section>

{% if site.firebase_db_url != "" %}
<script>
(function () {
  var DB = '{{ site.firebase_db_url }}';

  function animateCount(el, target) {
    var duration = 1400, start = Date.now();
    el.textContent = '0';
    function step() {
      var p = Math.min((Date.now() - start) / duration, 1);
      var ease = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(ease * target).toLocaleString();
      if (p < 1) setTimeout(step, 16);
    }
    setTimeout(step, 16);
  }

  fetch(DB + '/games.json')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data) return;
      Object.keys(data).forEach(function (game) {
        var el = document.querySelector('[data-game="' + game + '"]');
        if (el && typeof data[game] === 'number') animateCount(el, data[game]);
      });
    })
    .catch(function () {});
})();
</script>
{% endif %}
