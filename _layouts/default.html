<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}{% unless page.url == '/' %} | {{ site.title }}{% endunless %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ site.baseurl }}/css/modern.css">
  <link rel="shortcut icon" href="{{ site.baseurl }}/img/favicon.png">
  <meta name="theme-color" content="#0d1117">
  <meta name="google-site-verification" content="shV-uX9JiafQZT3nSkhQfC67DLrp3q7tVaSKXzBTe1c">
</head>
<body>
  {% include header.html %}
  <div class="page-body">
    {{ content }}
  </div>
  {% include footer.html %}
  <script>
    // ── Scroll animations ──────────────────────────────
    (function() {
      var els = document.querySelectorAll('.fade-up, .tl-card');
      if (!els.length) return;
      var io = new IntersectionObserver(function(entries) {
        entries.forEach(function(e) {
          if (e.isIntersecting) {
            e.target.classList.add('visible');
            io.unobserve(e.target);
          }
        });
      }, { threshold: 0.1 });
      els.forEach(function(el) { io.observe(el); });
    })();

    // ── Mobile nav toggle ──────────────────────────────
    (function() {
      var toggle = document.getElementById('nav-toggle');
      var mobile = document.getElementById('nav-mobile');
      if (!toggle || !mobile) return;
      toggle.addEventListener('click', function() {
        toggle.classList.toggle('open');
        mobile.classList.toggle('open');
      });
      mobile.querySelectorAll('a').forEach(function(a) {
        a.addEventListener('click', function() {
          toggle.classList.remove('open');
          mobile.classList.remove('open');
        });
      });
      // Close on outside click
      document.addEventListener('click', function(e) {
        if (!toggle.contains(e.target) && !mobile.contains(e.target)) {
          toggle.classList.remove('open');
          mobile.classList.remove('open');
        }
      });
    })();
  </script>
  {% include analytics.html %}
</body>
</html>
