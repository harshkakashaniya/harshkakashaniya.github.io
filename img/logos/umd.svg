<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 44">
  <!-- UMD red fill background pill -->
  <rect width="130" height="44" rx="6" fill="#1a1a2e"/>
  <!-- Maryland flag-inspired "M" icon: red and gold quarters -->
  <rect x="8" y="8" width="13" height="13" rx="1" fill="#E03A3E"/>
  <rect x="21" y="8" width="13" height="13" rx="1" fill="#FFD200"/>
  <rect x="8" y="21" width="13" height="13" rx="1" fill="#FFD200"/>
  <rect x="21" y="21" width="13" height="13" rx="1" fill="#E03A3E"/>
  <!-- Text -->
  <text x="44" y="19" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#E03A3E" letter-spacing="0.5">UNIVERSITY OF</text>
  <text x="44" y="31" font-family="Arial,sans-serif" font-size="11" font-weight="800" fill="#FFD200" letter-spacing="0.5">MARYLAND</text>
  <text x="44" y="40" font-family="Arial,sans-serif" font-size="6.5" font-weight="400" fill="#8b949e" letter-spacing="0.3">College Park</text>
