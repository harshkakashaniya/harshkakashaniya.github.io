<svg xmlns="http://www.w3.org/2000/svg" width="220" height="140" viewBox="0 0 220 140">
  <!-- Background -->
  <rect width="220" height="140" fill="#0d1117"/>

  <!-- Mini board grid (5x4 cells) -->
  <rect x="10" y="10" width="130" height="120" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <!-- Grid lines -->
  <line x1="36" y1="10" x2="36" y2="130" stroke="#30363d" stroke-width="0.5"/>
  <line x1="62" y1="10" x2="62" y2="130" stroke="#30363d" stroke-width="0.5"/>
  <line x1="88" y1="10" x2="88" y2="130" stroke="#30363d" stroke-width="0.5"/>
  <line x1="114" y1="10" x2="114" y2="130" stroke="#30363d" stroke-width="0.5"/>
  <line x1="10" y1="40" x2="140" y2="40" stroke="#30363d" stroke-width="0.5"/>
  <line x1="10" y1="70" x2="140" y2="70" stroke="#30363d" stroke-width="0.5"/>
  <line x1="10" y1="100" x2="140" y2="100" stroke="#30363d" stroke-width="0.5"/>

  <!-- Ladder (green) -->
  <line x1="36" y1="110" x2="62" y2="20" stroke="#2ecc71" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <line x1="25" y1="110" x2="51" y2="20" stroke="#2ecc71" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <line x1="25" y1="95" x2="36" y2="92" stroke="#2ecc71" stroke-width="2.5" opacity="0.7"/>
  <line x1="30" y1="78" x2="42" y2="75" stroke="#2ecc71" stroke-width="2.5" opacity="0.7"/>
  <line x1="36" y1="60" x2="48" y2="57" stroke="#2ecc71" stroke-width="2.5" opacity="0.7"/>
  <line x1="42" y1="42" x2="54" y2="39" stroke="#2ecc71" stroke-width="2.5" opacity="0.7"/>

  <!-- Snake (red) -->
  <path d="M 114 20 Q 135 45 100 55 Q 65 65 88 95 Q 100 115 75 125" stroke="#e74c3c" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.85"/>
  <!-- Snake head -->
  <circle cx="114" cy="20" r="7" fill="#e74c3c" opacity="0.9"/>
  <circle cx="111" cy="18" r="2" fill="white" opacity="0.8"/>
  <circle cx="117" cy="18" r="2" fill="white" opacity="0.8"/>

  <!-- Player tokens -->
  <circle cx="23" cy="122" r="9" fill="#e74c3c" stroke="white" stroke-width="2"/>
  <text x="23" y="126" text-anchor="middle" font-size="8" font-weight="bold" fill="white">P1</text>
  <circle cx="128" cy="122" r="9" fill="#3498db" stroke="white" stroke-width="2"/>
  <text x="128" y="126" text-anchor="middle" font-size="8" font-weight="bold" fill="white">P2</text>

  <!-- Right panel: dice + title -->
  <rect x="148" y="10" width="62" height="120" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="179" y="35" text-anchor="middle" font-size="22" fill="#f1c40f">⚄</text>
  <text x="179" y="58" text-anchor="middle" font-size="9" font-weight="700" fill="#f1c40f">ROLL</text>

  <rect x="156" y="68" width="46" height="18" rx="4" fill="#2ecc71" opacity="0.15" stroke="#2ecc71" stroke-width="1"/>
  <text x="179" y="81" text-anchor="middle" font-size="8" fill="#2ecc71" font-weight="600">2 Players</text>

  <rect x="156" y="92" width="46" height="18" rx="4" fill="#3498db" opacity="0.15" stroke="#3498db" stroke-width="1"/>
  <text x="179" y="105" text-anchor="middle" font-size="8" fill="#3498db" font-weight="600">vs CPU</text>

  <text x="179" y="128" text-anchor="middle" font-size="7" fill="#8b949e">🐍 🪜</text>
</svg>
