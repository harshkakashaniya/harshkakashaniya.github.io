<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4 in a Row</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0d1117; --card:#161b22; --border:#30363d;
      --red:#e74c3c; --yellow:#f1c40f; --board:#1a3a8f;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Inter',sans-serif; background:var(--bg); color:#e6edf3;
      min-height:100vh; display:flex; flex-direction:column;
      align-items:center; padding:20px 16px 40px;
    }

    /* ── HEADER ── */
    .header { text-align:center; margin-bottom:20px; }
    .header h1 {
      font-family:'Playfair Display',serif; font-size:2.4rem;
      background:linear-gradient(135deg,#e74c3c,#f1c40f);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .header p { color:#8b949e; margin-top:4px; }

    /* ── SETUP ── */
    #setup-screen {
      background:var(--card); border:1px solid var(--border);
      border-radius:16px; padding:36px 32px; max-width:460px; width:100%; text-align:center;
    }
    .setup-label {
      font-size:0.72rem; color:#8b949e; text-transform:uppercase;
      letter-spacing:1.5px; margin-bottom:14px; font-weight:600;
    }
    .setup-section { margin-bottom:26px; }
    .setup-cards { display:flex; gap:14px; justify-content:center; }
    .setup-card {
      flex:1; padding:20px 14px; border-radius:14px;
      border:2px solid var(--border); background:#0d1117; cursor:pointer;
      transition:all 0.2s; text-align:center; user-select:none;
    }
    .setup-card:hover { border-color:#555; transform:translateY(-3px); }
    .setup-card.selected { border-color:var(--yellow); background:rgba(241,196,15,0.07); }
    .setup-card .card-icon { font-size:2.4rem; margin-bottom:10px; }
    .setup-card .card-title { font-size:1rem; font-weight:700; color:#e6edf3; margin-bottom:5px; }
    .setup-card .card-desc  { font-size:0.78rem; color:#8b949e; line-height:1.5; }
    hr.divider { border:none; border-top:1px solid var(--border); margin:0 0 26px; }
    #start-btn {
      width:100%; padding:16px; border:none; border-radius:12px;
      background:linear-gradient(135deg,#e74c3c,#c0392b);
      color:#fff; font-size:1.05rem; font-weight:700; cursor:pointer;
      transition:all 0.2s; opacity:0.4; pointer-events:none;
    }
    #start-btn.ready { opacity:1; pointer-events:auto; }
    #start-btn.ready:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(231,76,60,0.35); }

    /* ── GAME ── */
    #game-screen { display:none; width:100%; max-width:860px; }
    .game-layout { display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap; justify-content:center; }

    /* ── BOARD AREA ── */
    .board-area { display:flex; flex-direction:column; align-items:center; }

    /* Column hover targets */
    .col-targets {
      display:grid; grid-template-columns:repeat(7,68px); margin-bottom:6px; gap:6px;
    }
    .col-target {
      height:44px; cursor:pointer; border-radius:10px;
      display:flex; align-items:center; justify-content:center;
      transition:background 0.15s;
    }
    .col-target:hover:not(.disabled) { background:rgba(255,255,255,0.06); }
    .col-target.disabled { cursor:not-allowed; }
    .drop-preview {
      width:52px; height:52px; border-radius:50%; opacity:0;
      transition:opacity 0.15s; transform:scale(0.8);
    }
    .col-target:hover:not(.disabled) .drop-preview { opacity:0.5; }
    .preview-red    { background:radial-gradient(circle at 35% 35%,#ff6b5b,#c0392b); }
    .preview-yellow { background:radial-gradient(circle at 35% 35%,#ffe566,#d4ac0d); }

    /* Board */
    .board {
      background:var(--board);
      border-radius:16px;
      padding:8px;
      display:grid;
      grid-template-columns:repeat(7,68px);
      grid-template-rows:repeat(6,68px);
      gap:6px;
      box-shadow:0 8px 32px rgba(0,0,0,0.6), inset 0 2px 8px rgba(0,0,0,0.4);
      position:relative;
    }
    .cell {
      border-radius:50%;
      background:#070e1a;
      box-shadow:inset 0 4px 12px rgba(0,0,0,0.8), inset 0 -2px 4px rgba(255,255,255,0.04);
      position:relative; overflow:hidden; cursor:pointer;
    }
    .cell:hover { background:#0d1a30; }
    .cell .piece {
      position:absolute; inset:0; border-radius:50%;
      transition:none;
    }
    .piece.red {
      background:radial-gradient(circle at 35% 30%, #ff6b5b 0%, #e74c3c 40%, #c0392b 100%);
      box-shadow:0 4px 12px rgba(231,76,60,0.5), inset 0 2px 4px rgba(255,255,255,0.2);
    }
    .piece.yellow {
      background:radial-gradient(circle at 35% 30%, #ffe566 0%, #f1c40f 40%, #d4ac0d 100%);
      box-shadow:0 4px 12px rgba(241,196,15,0.4), inset 0 2px 4px rgba(255,255,255,0.3);
    }
    .cell .piece.win-flash {
      animation:winFlash 0.55s ease infinite alternate;
    }
    @keyframes winFlash {
      0%  { filter:brightness(1)   scale(1); }
      100%{ filter:brightness(1.6) scale(1.06); }
    }

    /* ── SIDE PANEL ── */
    .side-panel { width:220px; display:flex; flex-direction:column; gap:14px; }
    .panel-card {
      background:var(--card); border:1px solid var(--border);
      border-radius:12px; padding:16px;
    }
    .panel-card h3 {
      font-size:0.78rem; color:#8b949e;
      text-transform:uppercase; letter-spacing:1px; margin-bottom:12px;
    }

    /* Player rows */
    .player-row {
      display:flex; align-items:center; gap:10px; padding:10px;
      border-radius:10px; margin-bottom:8px;
      border:2px solid transparent; transition:all 0.25s;
    }
    .player-row:last-child { margin-bottom:0; }
    .player-row.active { border-color:var(--yellow); background:rgba(241,196,15,0.07); }
    .player-disc {
      width:28px; height:28px; border-radius:50%; flex-shrink:0;
      box-shadow:0 2px 8px rgba(0,0,0,0.4);
    }
    .disc-red    { background:radial-gradient(circle at 35% 30%,#ff6b5b,#c0392b); }
    .disc-yellow { background:radial-gradient(circle at 35% 30%,#ffe566,#d4ac0d); }
    .player-info { flex:1; }
    .player-name { font-weight:600; font-size:0.9rem; }
    .player-score{ font-size:0.8rem; color:#8b949e; margin-top:2px; }
    .turn-badge {
      font-size:0.68rem; background:var(--yellow); color:#000;
      padding:2px 7px; border-radius:10px; font-weight:700;
    }

    /* Status */
    #status-msg {
      font-size:0.9rem; text-align:center; padding:10px;
      border-radius:8px; background:rgba(255,255,255,0.04);
      color:#8b949e; min-height:40px; display:flex;
      align-items:center; justify-content:center;
    }

    /* Buttons */
    .action-btn {
      width:100%; padding:12px; border:none; border-radius:10px;
      font-size:0.95rem; font-weight:700; cursor:pointer; transition:all 0.2s;
    }
    #new-game-btn {
      background:linear-gradient(135deg,#e74c3c,#c0392b); color:#fff;
    }
    #new-game-btn:hover { transform:translateY(-2px); box-shadow:0 4px 16px rgba(231,76,60,0.35); }
    #back-btn {
      background:transparent; color:#8b949e;
      border:1px solid var(--border); margin-top:4px;
    }
    #back-btn:hover { border-color:#aaa; color:#e6edf3; }

    /* ── WIN OVERLAY ── */
    #win-modal {
      display:none; position:fixed; inset:0;
      background:rgba(0,0,0,0.78); z-index:200;
      align-items:center; justify-content:center;
    }
    #win-modal.show { display:flex; }
    .win-box {
      background:var(--card); border-radius:20px; padding:40px;
      text-align:center; max-width:360px; width:90%;
      animation:popIn 0.4s cubic-bezier(.175,.885,.32,1.275) forwards;
    }
    @keyframes popIn {
      0%{ transform:scale(0.4); opacity:0; }
      100%{ transform:scale(1); opacity:1; }
    }
    .win-disc {
      width:64px; height:64px; border-radius:50%; margin:0 auto 16px;
    }
    .win-box h2 {
      font-family:'Playfair Display',serif; font-size:2rem; margin-bottom:8px;
    }
    .win-box p { color:#8b949e; margin-bottom:24px; }
    .win-box .win-btns { display:flex; gap:10px; }
    .win-box .win-btns button {
      flex:1; padding:12px; border:none; border-radius:10px;
      font-size:0.95rem; font-weight:700; cursor:pointer; transition:all 0.2s;
    }
    .win-btns .btn-rematch { background:var(--yellow); color:#000; }
    .win-btns .btn-rematch:hover { transform:translateY(-2px); }
    .win-btns .btn-menu { background:rgba(255,255,255,0.08); color:#e6edf3; border:1px solid var(--border); }
    .win-btns .btn-menu:hover { border-color:#aaa; }

    /* ── CONFETTI ── */
    .confetti {
      position:fixed; width:9px; height:9px; border-radius:2px;
      z-index:300; animation:confettiFall 1.8s ease-in forwards;
    }
    @keyframes confettiFall {
      0%{ transform:translateY(-10px) rotate(0deg); opacity:1; }
      100%{ transform:translateY(100vh) rotate(720deg); opacity:0; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>🔴 4 in a Row 🟡</h1>
  <p>Connect four discs to win!</p>
</div>

<!-- SETUP -->
<div id="setup-screen">
  <div class="setup-section">
    <div class="setup-label">Choose Mode</div>
    <div class="setup-cards">
      <div class="setup-card" id="card-2p" onclick="selectMode('2p')">
        <div class="card-icon">👥</div>
        <div class="card-title">2 Players</div>
        <div class="card-desc">Play locally against a friend.</div>
      </div>
      <div class="setup-card" id="card-cpu" onclick="selectMode('cpu')">
        <div class="card-icon">🤖</div>
        <div class="card-title">vs CPU</div>
        <div class="card-desc">Challenge the computer AI.</div>
      </div>
    </div>
  </div>
  <hr class="divider">
  <button id="start-btn" onclick="startGame()">Start Game →</button>
</div>

<!-- GAME -->
<div id="game-screen">
  <div class="game-layout">

    <!-- BOARD -->
    <div class="board-area">
      <!-- Column click targets + preview -->
      <div class="col-targets" id="col-targets"></div>
      <!-- Grid -->
      <div class="board" id="board"></div>
    </div>

    <!-- SIDE PANEL -->
    <div class="side-panel">
      <div class="panel-card">
        <h3>Players</h3>
        <div class="player-row" id="p1-row">
          <div class="player-disc disc-red"></div>
          <div class="player-info">
            <div class="player-name" id="p1-name">Player 1</div>
            <div class="player-score" id="p1-score">Wins: 0</div>
          </div>
          <div class="turn-badge" id="p1-badge">TURN</div>
        </div>
        <div class="player-row" id="p2-row">
          <div class="player-disc disc-yellow"></div>
          <div class="player-info">
            <div class="player-name" id="p2-name">Player 2</div>
            <div class="player-score" id="p2-score">Wins: 0</div>
          </div>
          <div class="turn-badge" id="p2-badge" style="display:none">TURN</div>
        </div>
      </div>

      <div class="panel-card">
        <h3>Status</h3>
        <div id="status-msg">Red goes first!</div>
      </div>

      <div class="panel-card">
        <button class="action-btn" id="new-game-btn" onclick="newGame()">🔄 New Game</button>
        <button class="action-btn" id="back-btn" onclick="backToMenu()">← Menu</button>
      </div>
    </div>
  </div>
</div>

<!-- WIN MODAL -->
<div id="win-modal">
  <div class="win-box">
    <div class="win-disc" id="win-disc"></div>
    <h2 id="win-title"></h2>
    <p id="win-sub"></p>
    <div class="win-btns">
      <button class="btn-rematch" onclick="newGame(); closeWin();">🔄 Rematch</button>
      <button class="btn-menu"    onclick="backToMenu(); closeWin();">← Menu</button>
    </div>
  </div>
</div>

<script>
  const ROWS = 6, COLS = 7;
  let board = [], currentPlayer = 0, gameOver = false, gameMode = '2p', cpuThinking = false;
  let scores = [0, 0];
  let setupMode = null;

  const COLORS = ['red', 'yellow'];
  const COLOR_NAMES = ['Red', 'Yellow'];

  /* ──────────────────────────────────────────
     SETUP
  ────────────────────────────────────────── */
  function selectMode(mode) {
    setupMode = mode;
    document.getElementById('card-2p').classList.toggle('selected', mode === '2p');
    document.getElementById('card-cpu').classList.toggle('selected', mode === 'cpu');
    document.getElementById('start-btn').classList.add('ready');
  }

  function startGame() {
    gameMode = setupMode;
    scores = [0, 0];
    document.getElementById('p2-name').textContent = gameMode === 'cpu' ? 'CPU 🤖' : 'Player 2';
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('game-screen').style.display  = 'block';
    buildBoard();
    newGame();
  }

  /* ──────────────────────────────────────────
     BUILD DOM
  ────────────────────────────────────────── */
  function buildBoard() {
    // Column targets
    const targets = document.getElementById('col-targets');
    targets.innerHTML = '';
    for (let c = 0; c < COLS; c++) {
      const t = document.createElement('div');
      t.className = 'col-target';
      t.dataset.col = c;
      t.onclick = () => handleClick(c);
      // Preview disc
      const prev = document.createElement('div');
      prev.className = 'drop-preview preview-red';
      prev.id = 'preview-' + c;
      t.appendChild(prev);
      targets.appendChild(t);
    }

    // Board cells
    const boardEl = document.getElementById('board');
    boardEl.innerHTML = '';
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.id = `cell-${r}-${c}`;
        cell.dataset.col = c;
        cell.onclick = () => handleClick(c);
        const piece = document.createElement('div');
        piece.className = 'piece';
        piece.id = `piece-${r}-${c}`;
        cell.appendChild(piece);
        boardEl.appendChild(cell);
      }
    }
  }

  /* ──────────────────────────────────────────
     NEW GAME (keep scores)
  ────────────────────────────────────────── */
  function newGame() {
    board = Array.from({length:ROWS}, () => Array(COLS).fill(null));
    currentPlayer = 0;
    gameOver = false;
    cpuThinking = false;

    // Clear pieces
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++) {
        const p = document.getElementById(`piece-${r}-${c}`);
        p.className = 'piece';
        p.style.transition = '';
        p.style.transform  = '';
      }

    // Reset column targets
    document.querySelectorAll('.col-target').forEach(t => t.classList.remove('disabled'));
    updatePreviews();
    updateUI();
    setStatus(`${COLOR_NAMES[0]}'s turn`);
  }

  function backToMenu() {
    document.getElementById('setup-screen').style.display = 'block';
    document.getElementById('game-screen').style.display  = 'none';
    setupMode = null;
    document.getElementById('card-2p').classList.remove('selected');
    document.getElementById('card-cpu').classList.remove('selected');
    document.getElementById('start-btn').classList.remove('ready');
  }

  /* ──────────────────────────────────────────
     HANDLE CLICK
  ────────────────────────────────────────── */
  async function handleClick(col) {
    if (gameOver || cpuThinking) return;
    if (gameMode === 'cpu' && currentPlayer === 1) return;

    const row = getDropRow(col);
    if (row === -1) return;

    await dropPiece(row, col, currentPlayer);
    const win = checkWin(row, col, currentPlayer);
    if (win) { endGame(currentPlayer, win); return; }
    if (isDraw()) { endDraw(); return; }

    currentPlayer = 1 - currentPlayer;
    updateUI();
    setStatus(`${COLOR_NAMES[currentPlayer]}'s turn`);

    if (gameMode === 'cpu' && currentPlayer === 1) {
      cpuThinking = true;
      disableTargets();
      await sleep(520);
      await cpuMove();
    }
  }

  /* ──────────────────────────────────────────
     DROP PIECE
  ────────────────────────────────────────── */
  function getDropRow(col) {
    for (let r = ROWS - 1; r >= 0; r--)
      if (board[r][col] === null) return r;
    return -1;
  }

  async function dropPiece(row, col, player) {
    board[row][col] = player;

    const boardEl  = document.getElementById('board');
    const cellSize = 68, gap = 6, padding = 8;
    const targetLeft = padding + col * (cellSize + gap);
    const targetTop  = padding + row * (cellSize + gap);

    // Create a floating piece that visually drops from above the board
    const floater = document.createElement('div');
    floater.className = `piece ${COLORS[player]}`;
    floater.style.position      = 'absolute';
    floater.style.width         = cellSize + 'px';
    floater.style.height        = cellSize + 'px';
    floater.style.borderRadius  = '50%';
    floater.style.left          = targetLeft + 'px';
    floater.style.top           = (-cellSize - 10) + 'px';
    floater.style.right         = 'auto';
    floater.style.bottom        = 'auto';
    floater.style.zIndex        = '20';
    floater.style.transition    = 'none';
    floater.style.transform     = 'none';
    floater.style.pointerEvents = 'none';
    boardEl.appendChild(floater);

    void floater.offsetWidth; // reflow

    // Gravity-like fall: ease-in so it accelerates downward
    const dropMs = 100 + row * 55;
    floater.style.transition = `top ${dropMs}ms cubic-bezier(0.4, 0, 1, 1)`;
    floater.style.top = targetTop + 'px';
    await sleep(dropMs + 10);

    // Bounce
    floater.style.transition = `top 0.09s ease-out`;
    floater.style.top = (targetTop - 9) + 'px';
    await sleep(90);
    floater.style.transition = `top 0.1s ease-in`;
    floater.style.top = targetTop + 'px';
    await sleep(110);

    // Snap actual cell piece into place, remove floater
    const piece = document.getElementById(`piece-${row}-${col}`);
    piece.className = `piece ${COLORS[player]}`;
    piece.style.transform = 'translateY(0)';
    floater.remove();

    updateColumnTarget(col);
  }

  function updateColumnTarget(col) {
    if (getDropRow(col) === -1) {
      const t = document.querySelector(`.col-target[data-col="${col}"]`);
      if (t) t.classList.add('disabled');
    }
  }

  function disableTargets() {
    document.querySelectorAll('.col-target').forEach(t => t.classList.add('disabled'));
  }
  function enableTargets() {
    document.querySelectorAll('.col-target').forEach(t => {
      const col = +t.dataset.col;
      if (getDropRow(col) !== -1) t.classList.remove('disabled');
    });
  }

  /* ──────────────────────────────────────────
     WIN CHECK
  ────────────────────────────────────────── */
  function checkWin(row, col, player) {
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    for (const [dr,dc] of dirs) {
      const cells = getCells(row, col, dr, dc, player);
      if (cells.length >= 4) return cells;
    }
    return null;
  }

  function getCells(row, col, dr, dc, player) {
    const cells = [[row,col]];
    for (const s of [-1,1]) {
      let r = row + dr*s, c = col + dc*s;
      while (r>=0&&r<ROWS&&c>=0&&c<COLS&&board[r][c]===player) {
        cells.push([r,c]); r+=dr*s; c+=dc*s;
      }
    }
    return cells;
  }

  function isDraw() {
    return board[0].every(cell => cell !== null);
  }

  /* ──────────────────────────────────────────
     END GAME
  ────────────────────────────────────────── */
  function endGame(player, winCells) {
    gameOver = true;
    disableTargets();
    scores[player]++;
    updateScores();

    // Flash winning pieces
    winCells.forEach(([r,c]) => {
      document.getElementById(`piece-${r}-${c}`).classList.add('win-flash');
    });

    const name = player === 0 ? document.getElementById('p1-name').textContent
                              : document.getElementById('p2-name').textContent;
    setStatus(`🎉 ${name} wins!`);
    setTimeout(() => showWin(player, name), 700);
  }

  function endDraw() {
    gameOver = true;
    disableTargets();
    setStatus("It's a draw!");
    setTimeout(() => showWinDraw(), 600);
  }

  function showWin(player, name) {
    const disc = document.getElementById('win-disc');
    disc.className = `win-disc ${player === 0 ? 'disc-red' : 'disc-yellow'}`;
    document.getElementById('win-title').textContent = `${name} Wins! 🎉`;
    document.getElementById('win-sub').textContent   = 'Connected 4 in a row!';
    document.getElementById('win-modal').classList.add('show');
    spawnConfetti();
    setTimeout(spawnConfetti, 350);
  }

  function showWinDraw() {
    document.getElementById('win-disc').className = 'win-disc';
    document.getElementById('win-disc').style.background = 'linear-gradient(135deg,#e74c3c,#f1c40f)';
    document.getElementById('win-title').textContent = "It's a Draw!";
    document.getElementById('win-sub').textContent   = 'No more moves left.';
    document.getElementById('win-modal').classList.add('show');
  }

  function closeWin() {
    document.getElementById('win-modal').classList.remove('show');
  }

  /* ──────────────────────────────────────────
     CPU AI  (minimax depth-5)
  ────────────────────────────────────────── */
  async function cpuMove() {
    let bestCol = minimax(board, 5, -Infinity, Infinity, true).col;
    if (bestCol === null) bestCol = Math.floor(COLS/2); // fallback

    const row = getDropRow(bestCol);
    await dropPiece(row, bestCol, 1);
    cpuThinking = false;
    enableTargets();
    const win = checkWin(row, bestCol, 1);
    if (win) { endGame(1, win); return; }
    if (isDraw()) { endDraw(); return; }
    currentPlayer = 0;
    updateUI();
    setStatus(`${COLOR_NAMES[0]}'s turn`);
  }

  function minimax(b, depth, alpha, beta, maximizing) {
    const cols = getValidCols(b);
    const isTerminal = cols.length === 0 || checkTerminal(b);
    if (depth === 0 || isTerminal) return { col:null, score: scoreBoard(b) };

    let bestCol = cols[Math.floor(cols.length/2)];
    let bestScore = maximizing ? -Infinity : Infinity;

    for (const col of orderCols(cols)) {
      const row = getDropRowB(b, col);
      const nb  = b.map(r=>[...r]);
      nb[row][col] = maximizing ? 1 : 0;
      const { score } = minimax(nb, depth-1, alpha, beta, !maximizing);
      if (maximizing && score > bestScore) { bestScore=score; bestCol=col; alpha=Math.max(alpha,score); }
      if (!maximizing && score < bestScore){ bestScore=score; bestCol=col; beta=Math.min(beta,score);  }
      if (beta <= alpha) break;
    }
    return { col:bestCol, score:bestScore };
  }

  function orderCols(cols) {
    const center = Math.floor(COLS/2);
    return [...cols].sort((a,b)=>Math.abs(a-center)-Math.abs(b-center));
  }

  function getValidCols(b)    { return [...Array(COLS).keys()].filter(c=>b[0][c]===null); }
  function getDropRowB(b,col) { for(let r=ROWS-1;r>=0;r--)if(b[r][col]===null)return r; return -1; }

  function checkTerminal(b) {
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++)
      if(b[r][c]!==null&&checkWinB(b,r,c,b[r][c])) return true;
    return false;
  }

  function checkWinB(b,row,col,p) {
    const dirs=[[0,1],[1,0],[1,1],[1,-1]];
    for(const [dr,dc] of dirs){
      let cnt=1;
      for(const s of[-1,1]){let r=row+dr*s,c=col+dc*s;while(r>=0&&r<ROWS&&c>=0&&c<COLS&&b[r][c]===p){cnt++;r+=dr*s;c+=dc*s;}}
      if(cnt>=4)return true;
    }
    return false;
  }

  function scoreBoard(b) {
    let score = 0;
    const center = Math.floor(COLS/2);
    // Center column preference
    let centerCount = 0;
    for(let r=0;r<ROWS;r++) if(b[r][center]===1) centerCount++;
    score += centerCount * 3;

    // Score all windows of 4
    const dirs=[[0,1],[1,0],[1,1],[1,-1]];
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) for(const [dr,dc] of dirs) {
      const window=[];
      for(let i=0;i<4;i++){const rr=r+dr*i,cc=c+dc*i;if(rr<0||rr>=ROWS||cc<0||cc>=COLS)break;window.push(b[rr][cc]);}
      if(window.length===4) score+=scoreWindow(window);
    }
    return score;
  }

  function scoreWindow(w) {
    const cpu   = w.filter(x=>x===1).length;
    const human = w.filter(x=>x===0).length;
    const empty = w.filter(x=>x===null).length;
    if(cpu===4) return 100;
    if(cpu===3&&empty===1) return 5;
    if(cpu===2&&empty===2) return 2;
    if(human===3&&empty===1) return -4;
    if(human===4) return -100;
    return 0;
  }

  /* ──────────────────────────────────────────
     UI HELPERS
  ────────────────────────────────────────── */
  function updateUI() {
    ['p1','p2'].forEach((p,i)=>{
      document.getElementById(`${p}-row`).className='player-row'+(currentPlayer===i?' active':'');
      document.getElementById(`${p}-badge`).style.display=currentPlayer===i?'block':'none';
    });
    updatePreviews();
  }

  function updatePreviews() {
    const cls = currentPlayer===0 ? 'preview-red' : 'preview-yellow';
    document.querySelectorAll('.drop-preview').forEach(p=>{
      p.className='drop-preview '+cls;
    });
  }

  function updateScores() {
    document.getElementById('p1-score').textContent = 'Wins: '+scores[0];
    document.getElementById('p2-score').textContent = 'Wins: '+scores[1];
  }

  function setStatus(msg) {
    document.getElementById('status-msg').textContent = msg;
  }

  function spawnConfetti() {
    const colors=['#e74c3c','#f1c40f','#3498db','#2ecc71','#9b59b6','#e67e22'];
    for(let i=0;i<55;i++){
      const c=document.createElement('div');
      c.className='confetti';
      c.style.left=(Math.random()*100)+'vw';
      c.style.background=colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDelay=(Math.random()*0.6)+'s';
      c.style.animationDuration=(1.2+Math.random()*0.8)+'s';
      c.style.borderRadius=Math.random()>0.5?'50%':'2px';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),2200);
    }
  }

  function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
</script>
